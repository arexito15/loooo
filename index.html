<script>
var cus=false,mode="a",idx=0,score=0,tries=0,cur=null,done=false,TOTAL=10;

  var A=Math.round(cur.dividend*f),B=Math.round(cur.divisor*f);

 }else{
  tries++;

 }
}
function next(){
 if(!done&&tries<2){document.getElementById("msg").innerHTML='<span class="bad">Primero resuelve este (o toca Revisar).</span>';return}
 if(cus){cus=false;show();return}idx++;

  var t=score>=9?"¡Eres una campeona! 🏆":score>=6?"¡Muy bien! 👏":"¡Sigue practicando, vas mejorando! 💪";

  document.getElementById("msg").innerHTML=t+'<br>Toca Siguiente para jugar otra vez.';

 }

}
var vt=null;

}

}
function showVideo(direct){

 var c=cur,hasD=c.vd>0,dend=fmt(c.dividend,c.dd),dor=fmt(c.divisor,c.vd),S=[],A2=dend,B=Math.round(c.divisor);

  return ok?'<div style="padding-left:'+Math.max(k-n+1,0)+'ch"><span class="bx">'+a.join('')+'</span></div>':srow(String(r),k,false)}
 var done=[],hist=[],dhSnap='',seenExt=[],first=true,k=0,cu=ds[0],q='',qc=false,ext=0,CR=[],LB=[],TN=[],CC=[],ic=0,PAL=['#3b82f6','#e6a700','#a855f7','#14b8a6'],HX=-1,HX2=-1,Hb=-1,MK=false,n,o;
 while(cu<B&&k<ds.length-1){k++;cu=cu*10+ds[k]}
 while(true){
  var cs=String(cu),base=first?[]:done.slice(0,-1);n=cs.length;o=cs.split('').map(Number).reverse();MK=first;var repeat=false;if(k>=ds.length){repeat=seenExt.indexOf(cu)>=0;seenExt.push(cu)}

    var rv=j<rev&&res[j]!==undefined,lz=false;
    
    b.push(rv&&!lz?ce(res[j]):ce('&nbsp;'))}

  res=[];var cap0='',nq=q,qd,r,nd=-1;HX=-1;HX2=-1;Hb=-1;

    for(j=0;j<bd.length;j++){var v=e*bd[j]+car;pd.push(v%10);ms.push(e+' × '+bd[j]+(car?' + '+car+' que llevaba':'')+' = '+v+(v>=10?' (anoto '+v%10+' y llevo '+Math.floor(v/10)+')':''));car=Math.floor(v/10)}

    var res=[],fail=false;
